[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "shopdesk-ai"
version = "0.1.0"
description = "E-commerce customer support with contextual RAG, hybrid search and human handoff"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "langchain>=1.4,<2", "langchain-openai>=1.7,<2", "langchain-text-splitters>=1,<2",
 "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4", "langsmith>=0.14.8,<1",
 "qdrant-client>=1.12,<2", "rank-bm25>=0.2.2,<1", "jieba>=0.42.1,<1",
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3",
 "httpx>=0.28,<1", "python-dotenv>=1,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<1", "build>=1,<2"]
cross-encoder = ["sentence-transformers>=3,<6"]
[project.scripts]
shopdesk = "shopdesk.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
shopdesk = ["assets/prompts/*.md", "assets/data/*.json", "assets/web/*.html", "assets/web/*.css", "assets/web/*.js", "assets/web/*.svg"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
